<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keniel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="parameters">
        <h3>Grid Dimensions</h3>
        <label for="grid_width">Grid Width (X):</label>
        <input type="number" id="grid_width" value="15" min="1">
        <label for="grid_length">Grid Length (Y):</label>
        <input type="number" id="grid_length" value="15" min="1">

        <h3>Snake Speed</h3>
        <input type="number" id="snake_speed" value="7" min="0">
        <br><br>
        <button id="generate_btn">Generate Grid</button>
    </div>
    <h1 id = "score"><div>smth</div><div> hey</div></h1>
    <button id = "start_game">Start Game</button>
    <script src="script.js" defer></script>
</body>
</html>
